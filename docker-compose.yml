# ─────────────────────────────────────────────────────────────────────────────
#  Vision Stream System — docker-compose
#
#  Usage:
#    1. Place your video file in ./video/result.mp4
#    2. docker compose up --build
#
#  Ports exposed on the host:
#    8554  — RTSP stream   (rtsp://localhost:8554/live)
#    8000  — vprocessor    (http://localhost:8000)
#    3000  — vdashboard    (http://localhost:3000)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  vss-net:
    driver: bridge

volumes:
  output-data:

services:
  # ── vstreamer ────────────────────────────────────────────────────────────────
  vstreamer:
    build:
      context: ./vstreamer
      dockerfile: Dockerfile
    container_name: vstreamer
    restart: unless-stopped
    networks:
      - vss-net
    ports:
      - "8554:8554"
      - "8556:8556/udp" # UDP RTP
      - "8557:8557/udp" # UDP RTCP
    volumes:
      # Mount local ./video directory as read-only; put your video file here
      - ./video:/video:ro
    command:
      - "--video"
      - "/video/result.mp4"
      - "--port"
      - "8554"
      - "--udp-rtp"
      - "8556"
      - "--udp-rtcp"
      - "8557"
      - "--path"
      - "live"
      - "--loop"
      - "true"
    healthcheck:
      # nc checks that the RTSP TCP port is accepting connections
      test: ["CMD-SHELL", "nc -z localhost 8554 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 8s

  # ── vprocessor ───────────────────────────────────────────────────────────────
  vprocessor:
    build:
      context: ./vprocessor
      dockerfile: Dockerfile
    container_name: vprocessor
    restart: unless-stopped
    networks:
      - vss-net
    ports:
      - "8000:8000"
    environment:
      - RTSP_URL=rtsp://vstreamer:8554/live
      - OUTPUT_DIR=/app/output
      - YOLO_MODEL=${YOLO_MODEL:-yolov8n.pt}
      - YOLO_IMGSZ=${YOLO_IMGSZ:-640}
      - DETECT_EVERY_N=${DETECT_EVERY_N:-1}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.5}
      - INFERENCE_SCALE=${INFERENCE_SCALE:-0.5}
      - METADATA_FLUSH_EVERY=${METADATA_FLUSH_EVERY:-1}
      - RECORD_OUTPUT=${RECORD_OUTPUT:-true}
      - PROFILE_PIPELINE=${PROFILE_PIPELINE:-false}
      - PROFILE_LOG_INTERVAL_SECONDS=${PROFILE_LOG_INTERVAL_SECONDS:-5}
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      # Persisted recordings and metadata land here on the host
      - output-data:/app/output
      # Optionally bind-mount for direct host access:
      # - ./output:/app/output
    depends_on:
      vstreamer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s # YOLOv8 model download can take a while on first run

  # ── vdashboard ───────────────────────────────────────────────────────────────
  vdashboard:
    build:
      context: ./vdashboard
      dockerfile: Dockerfile
    container_name: vdashboard
    restart: unless-stopped
    networks:
      - vss-net
    ports:
      - "3000:80"
    depends_on:
      vprocessor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
