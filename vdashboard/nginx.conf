# =============================================================================
# nginx.conf – produkční konfigurace reverzní proxy
# =============================================================================
#
# Tento soubor konfiguruje nginx jako produkční reverzní proxy pro celý
# systém vision-stream. Plní dvě hlavní role:
#
#   1. Statický souborový server – obsluhuje zkompilované soubory React SPA
#      (JavaScript, CSS, HTML) uložené v /usr/share/nginx/html.
#
#   2. Reverzní proxy k backendu vprocessor – přeposílá požadavky na tři typy
#      endpointů: REST API (/api/), MJPEG video stream (/stream) a
#      Socket.IO spojení (/socket.io/).
#
# V produkčním prostředí tento soubor přebírá roli, kterou v development
# režimu plní Vite dev server s konfigurací `server.proxy` ve vite.config.ts.
# Tím se eliminuje problém s CORS – veškerý provoz (frontend i backend)
# prochází přes jediný origin (port 80), takže browser nevyžaduje
# preflight požadavky.
#
# Topologie:
#   Browser → nginx :80 → (statické soubory | proxy → vprocessor :8000)
#
# =============================================================================

server {
    listen 80;
    # server_name _ zachytí jakýkoli hostname (wildcard); vhodné pro Docker
    # prostředí, kde hostname kontejneru není předem znám.
    server_name _;

    # Kořenový adresář statických souborů – sem Dockerfile zkopíruje výstup
    # příkazu `vite build` (adresář dist/).
    root /usr/share/nginx/html;
    # Výchozí soubor pro požadavky na adresář.
    index index.html;


    # -------------------------------------------------------------------------
    # Statické assety s dlouhodobým cache
    # -------------------------------------------------------------------------
    #
    # Vite při buildu vkládá do názvů souborů v /assets/ hash obsahu,
    # např. „main-Bx3fK9aQ.js". Díky tomu je název souboru jedinečný pro
    # každou verzi obsahu a lze bezpečně nastavit extrémně dlouhou dobu
    # platnosti cache (1 rok = prakticky „navždy").
    #
    # Cache-Control: public
    #   → soubor smí cachovat jak browser, tak CDN / proxy cache
    # Cache-Control: immutable
    #   → říká browseru, že soubor se nikdy nezmění; browser proto neprovádí
    #     podmíněný revalidační požadavek (If-None-Match / If-Modified-Since)
    #     ani po uplynutí max-age, dokud je soubor v cache. Výsledkem je
    #     nulová síťová zátěž pro opakované návštěvy.
    #
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    # -------------------------------------------------------------------------
    # MJPEG video stream
    # -------------------------------------------------------------------------
    #
    # /stream je endpoint vprocessoru, který vrací HTTP response s content-type
    # „multipart/x-mixed-replace". Jde o nekonečnou odpověď – server nikdy
    # neuzavře spojení a místo toho průběžně posílá JPEG snímky oddělené
    # hraničním řetězcem (boundary). Toto chování klade zvláštní požadavky
    # na konfiguraci proxy:
    #
    # proxy_buffering off
    #   → nginx standardně bufferuje odpověď backendu do paměti/disku než ji
    #     přepošle klientovi. Pro MJPEG by to znamenalo, že nginx by se pokoušel
    #     načíst celou „nekonečnou" odpověď, aniž by cokoli odeslal. Vypnutím
    #     bufferování nginx přeposílá každý přijatý bajt klientovi okamžitě,
    #     takže browser dostává snímky v reálném čase.
    #
    # proxy_cache off
    #   → explicitně zakáže ukládání streamu do cache (pro jistotu, kdyby byla
    #     globálně nakonfigurována proxy_cache zóna).
    #
    # proxy_read_timeout / proxy_send_timeout 3600s
    #   → nginx by jinak uzavřel spojení po výchozím timeoutu (60 s) při absenci
    #     dat. MJPEG stream je záměrně „tiché" spojení v okamžiku, kdy procesor
    #     nepřenáší snímky. Timeout 1 hodina zajišťuje, že nginx nevybije
    #     dlouhodobé streamovací relace.
    #
    location /stream {
        proxy_pass http://vprocessor:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Vypnutí bufferování – klíčové pro nekonečný MJPEG stream
        proxy_buffering off;
        proxy_cache off;

        # Prodloužené timeouty kvůli dlouhodobým streamovacím relacím
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    # -------------------------------------------------------------------------
    # REST API backendu
    # -------------------------------------------------------------------------
    #
    # Standardní reverzní proxy pro synchronní REST požadavky (GET, POST, …).
    # Browser posílá požadavky na /api/* a nginx je přeposílá na vprocessor.
    # changeOrigin není potřeba konfigurovat v nginx (to je Vite/Node koncept);
    # stačí správně předat hlavičky Host a X-Forwarded-For pro logging a
    # případné rate-limiting na backendu.
    #
    location /api/ {
        proxy_pass http://vprocessor:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # -------------------------------------------------------------------------
    # Socket.IO (WebSocket + long-polling)
    # -------------------------------------------------------------------------
    #
    # Socket.IO zahajuje komunikaci jako standardní HTTP požadavek a poté
    # provede „upgrade" na protokol WebSocket pomocí HTTP mechanismu:
    #
    #   GET /socket.io/?... HTTP/1.1
    #   Connection: Upgrade
    #   Upgrade: websocket
    #
    # Nginx musí tyto hlavičky explicitně přeposlat backendu, jinak upgrade
    # selže a Socket.IO přejde do pomalejšího long-polling režimu.
    #
    # proxy_set_header Upgrade $http_upgrade
    #   → předá hodnotu hlavičky „Upgrade" z požadavku klienta backendu
    #     (typicky hodnota „websocket")
    #
    # proxy_set_header Connection "upgrade"
    #   → říká backendu, že toto spojení má být upgradováno; bez této hlavičky
    #     by backend ignoroval Upgrade header
    #
    # proxy_http_version 1.1
    #   → WebSocket vyžaduje HTTP/1.1; HTTP/1.0 upgrade nepodporuje
    #
    # proxy_buffering off
    #   → Socket.IO posílá krátké real-time události (JSON zprávy o stavu
    #     procesoru); bufferování by zavádělo latenci a znehodnotilo by
    #     real-time charakter komunikace
    #
    # proxy_read_timeout / proxy_send_timeout 3600s
    #   → WebSocket spojení je dlouhodobé; výchozí 60 s timeout by ho
    #     přerušil i při krátkých pauzách bez zpráv (heartbeat může mít
    #     interval desítek sekund)
    #
    # proxy_connect_timeout 10s
    #   → krátký timeout pro samotné navázání TCP spojení na backend;
    #     pokud backend neodpoví do 10 s, nginx vrátí 502
    #
    location /socket.io/ {
        proxy_pass http://vprocessor:8000;
        proxy_http_version 1.1;

        # Hlavičky pro WebSocket handshake (HTTP → WS upgrade)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prodloužené timeouty pro dlouhodobá WebSocket spojení
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Krátký timeout pro samotné navázání spojení na backend
        proxy_connect_timeout 10s;

        # Vypnutí bufferování pro okamžité doručení real-time událostí
        proxy_buffering off;
    }


    # -------------------------------------------------------------------------
    # SPA fallback – React Router podpora
    # -------------------------------------------------------------------------
    #
    # React aplikace používá client-side routing (React Router). Když uživatel
    # přímo navštíví URL jako /dashboard nebo stiskne F5 na vnořené cestě,
    # browser pošle požadavek na nginx. Nginx nenajde odpovídající soubor na
    # disku (existuje pouze index.html) a bez tohoto pravidla by vrátil 404.
    #
    # try_files $uri $uri/ /index.html funguje takto:
    #   1. $uri       → pokus o nalezení souboru s přesnou cestou (např. /logo.png)
    #   2. $uri/      → pokus o nalezení adresáře s index souborem
    #   3. /index.html → fallback: vrátí hlavní HTML soubor SPA; React Router
    #                    pak přečte URL v browseru a zobrazí správnou komponentu
    #
    # Tento blok musí být poslední (nejnižší specificita), aby ho předchozí
    # location bloky pro /api/, /stream a /socket.io/ vždy překryly.
    #
    location / {
        try_files $uri $uri/ /index.html;
    }


    # -------------------------------------------------------------------------
    # Potlačení favicon 404 šumu v access logu
    # -------------------------------------------------------------------------
    #
    # Browsery automaticky požadují /favicon.ico při každé návštěvě stránky.
    # Pokud soubor neexistuje, nginx zapíše 404 do access logu. U produkčního
    # nasazení bez vlastní favikony by to zahlcovalo logy zbytečnými záznamy.
    #
    # log_not_found off → nepíše chybu do error logu při nenalezení souboru
    # access_log off    → nepíše záznam do access logu pro tento endpoint
    #
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
